<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카페귀천 · Menu 2 · Brunch</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="css/style.css?v=20260804ak" />
</head>
<body class="platter-page">
  <div class="platter-board" data-page="menu2">
    <div class="platter-atmosphere" aria-hidden="true">
      <div class="platter-atmosphere__pattern"></div>
      <div class="platter-atmosphere__wash"></div>
      <div class="platter-atmosphere__vignette"></div>
      <div class="platter-atmosphere__motifs" id="platter-motifs"></div>
    </div>

    <div class="platter-board__inner">
      <div class="platter-brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <header class="platter-board__header">
        <h1 class="platter-board__title" data-title="BRUNCH">BRUNCH</h1>
        <p class="platter-board__tagline">Platters &amp; Desserts</p>
        <div class="platter-board__rule" aria-hidden="true"></div>
      </header>

      <main class="platter-board__main" id="menu-root" aria-live="polite">
        <!-- 메뉴는 js/menu.js에서 렌더링 -->
      </main>

      <footer class="platter-board__footer">
        <div class="platter-board__rule" aria-hidden="true"></div>
        <img
          class="platter-board__logo"
          src="images/logo-gwicheon.png?v=20260804ak"
          alt="카페귀천"
          width="1853"
          height="1133"
        />
      </footer>
    </div>
  </div>

  <script src="js/menu.js?v=20260804ak" defer></script>
  <script src="js/platter-fx.js?v=20260804ak" defer></script>
  <script src="js/refresh.js?v=20260804ak" defer></script>
</body>
</html>
